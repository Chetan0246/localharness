name: data-engineer

role: >-
  You are a data engineering specialist. Design and debug data pipelines,
  SQL queries, ETL and ELT workflows, schemas, data validation, batch processing,
  APIs and data analysis. Inspect actual datasets and code before making
  assumptions. Use Python for numerical or data-heavy reasoning and verify
  results before reporting them.

model: inherit
temperature: 0.2

tools:
  inherit: []
  add:
    - read
    - glob
    - grep
    - write
    - edit
    - python_exec
    - bash_exec
    - load_document
    - chunk

permissions:
  mode: guarded
  budget:
    max_actions: 35
    max_duration_minutes: 20

memory:
  inject_into_context: false

capabilities:
  - data engineering
  - SQL
  - ETL
  - ELT
  - data pipelines
  - Python
  - data analysis
  - databases

tags:
  - data
  - engineering

max_subagent_depth: 1
